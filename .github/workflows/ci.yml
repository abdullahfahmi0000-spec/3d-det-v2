name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main so newly published advisories are caught even when nothing changes.
  schedule:
    - cron: '0 1 * * 1' # Monday 06:00 Asia/Karachi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  GITLEAKS_VERSION: '8.21.2'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architectural boundaries
        run: pnpm check:boundaries

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret-bearing files are rejected by name, whatever they contain: an .env file with
      # harmless-looking values is still a file that must never be committed.
      - name: Reject secret-bearing files
        run: |
          set -euo pipefail
          pattern='(^|/)\.env(\.[^/]*)?$|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$|\.tfstate(\.backup)?$|(^|/)\.aws/credentials$'
          found=$(git ls-files | grep -E "$pattern" | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            while IFS= read -r file; do
              echo "::error file=${file}::Secret-bearing file committed: ${file}"
            done <<< "$found"
            echo "Remove these files, rotate anything they contained, and see docs/SECURITY.md."
            exit 1
          fi
          echo "No secret-bearing files tracked."

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks version

      # Scans every commit reachable from the checkout, so a secret that was added and later
      # deleted is still found. Findings are redacted in the log.
      - name: Scan git history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails on high and critical advisories in any dependency, including development tools.
      # Accepted exceptions are recorded in docs/security/dependency-audit.md.
      - name: Audit dependencies (fail on high or critical)
        run: pnpm audit --audit-level high
