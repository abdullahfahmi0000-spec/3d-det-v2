# Dependabot version updates. Security updates are switched on separately in the repository's
# Code security settings (see docs/development/github-setup.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
