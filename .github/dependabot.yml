# Dependabot version updates, kept deliberately quiet: everything is grouped, so a normal week
# produces at most two npm pull requests and a normal month one GitHub Actions pull request.
# Security updates are switched on separately in the repository's Code security settings and are
# not limited by this file (see docs/development/github-setup.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Karachi
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # Type definitions follow the Node runtime line in .nvmrc (Node 24); see pnpm-workspace.yaml.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Asia/Karachi
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
